name: build-and-run

on:
  push:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: build the docker image
        run: docker build -t my-app .

      - name: run the docker container
        run: docker run -d --name my-app-container -p 5000:5000 my-app

      - name: show running container
        run: docker ps

      - name: wait for the application
        run: sleep 5

      - name: test the application
        run: curl --fail http://localhost:5000

      - name: show container logs
        run: docker logs my-app-container

      - name: cleanup container
        if: always()
        run: docker rm -f my-app-container || true
